tasks.named('test') {
  useJUnitPlatform {
    // Nothing is excluded by default. A suite whose cases are wall-clock acceptance criteria is
    // tagged `timing`, and a developer building something else on the same machine can leave those
    // cases out BY NAME - `./gradlew test -PexcludeTags=timing` - rather than by disabling the
    // suite that holds them.
    if (project.hasProperty('excludeTags')) {
      excludeTags(*project.property('excludeTags').toString().split(',').collect { it.trim() })
    }
  }
  systemProperty 'API_SPEC_VERSION', project.version
  failFast = !Boolean.getBoolean("test.noFailFast")
  // One forked JVM runs the whole suite, and the container-backed suites keep a great deal alive in
  // it at once: several Spring contexts, WireMock servers, Testcontainers clients and the Service
  // Bus emulator's AMQP stack. Gradle's default 512m test heap is not enough for that - the run dies
  // with an OutOfMemoryError while a late suite is refreshing its context, which reads as a failure
  // of whichever suite happened to be last rather than as the memory ceiling it is. Stated here so
  // the ceiling is a decision rather than a default.
  maxHeapSize = '2g'
  // Mockito must be added as an agent, see:
  // https://javadoc.io/doc/org.mockito/mockito-core/latest/org.mockito/org/mockito/Mockito.html#0.3
  jvmArgs += [
    "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
  ]
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
    showStandardStreams = true
  }
  reports {
    junitXml.required.set(true)
    html.required.set(true)
  }
}

tasks.named('jacocoTestReport') {
  dependsOn tasks.named('test')
  executionData fileTree(
    dir: layout.buildDirectory.dir("jacoco").get().asFile,
    include: ["*.exec"]
  )
  reports {
    xml.required.set(true)
    csv.required.set(false)
    html.required.set(true)
  }
}

// Coverage ratchet: locks in business-logic coverage so a PR cannot silently drop it. The bootstrap
// class and config/** (no meaningful branching) are excluded so the gate reflects logic coverage.
// The thresholds are the sibling services' (line 0.88, branch 0.85) from the first commit rather
// than grown into: a ratchet that starts low is only ever argued upwards in principle. Raise them
// as coverage improves; ci-build-publish.yml refuses a PR that lowers one.
tasks.named('jacocoTestCoverageVerification') {
  dependsOn tasks.named('test')
  // The report is written before the gate is asked its question, so a failing gate still leaves a
  // report behind saying which lines were missed. Ordering only: nothing here asks for the report.
  mustRunAfter tasks.named('jacocoTestReport')
  executionData fileTree(
    dir: layout.buildDirectory.dir("jacoco").get().asFile,
    include: ["*.exec"]
  )
  classDirectories.setFrom(
    files(sourceSets.main.output.collect {
      fileTree(dir: it, exclude: [
        'uk/gov/hmcts/cp/probationresultsdistribution/Application.class',
        'uk/gov/hmcts/cp/probationresultsdistribution/config/**'
      ])
    })
  )
  violationRules {
    rule {
      limit {
        counter = 'LINE'
        value = 'COVEREDRATIO'
        minimum = 0.88
      }
      limit {
        counter = 'BRANCH'
        value = 'COVEREDRATIO'
        minimum = 0.85
      }
    }
  }
}

// Make the gate part of `check` (and therefore `build`).
tasks.named('check') {
  dependsOn tasks.named('jacocoTestCoverageVerification')
}